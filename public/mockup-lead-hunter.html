<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Hunter - Arias CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fafafa;
            color: #1e293b;
        }
        .soft-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        }
        .soft-card-selected {
            background: #f8fafc;
            border: 1.5px solid #6366f1;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.08);
        }
        .btn-friendly-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            transition: all 0.2s ease;
        }
        .btn-friendly-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .btn-friendly-accent {
            background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
            transition: all 0.2s ease;
        }
        .btn-friendly-accent:hover {
            background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
        }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">

    <!-- HEADER DELICADO Y LIMPIO -->
    <div class="max-w-4xl mx-auto mb-8 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                ▲
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Arias <span class="text-indigo-600">CRM</span></h1>
                <p class="text-xs text-slate-500 font-medium">Buscador Inteligente de Prospectos</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-200/60">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Google Maps API Conectado
            </span>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL MINIMALISTA -->
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- BARRA DE BÚSQUEDA DELICADA -->
        <div class="soft-card rounded-2xl p-4">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                
                <div class="md:col-span-5 bg-slate-50/80 rounded-xl px-3.5 py-2.5 border border-slate-200/80 flex items-center gap-3">
                    <span class="text-slate-400 text-sm">🔍</span>
                    <div class="w-full">
                        <label class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Término de Búsqueda</label>
                        <input type="text" value="Iglesias cristianas" class="w-full bg-transparent text-slate-800 font-semibold text-sm focus:outline-none" readonly>
                    </div>
                </div>

                <div class="md:col-span-4 bg-slate-50/80 rounded-xl px-3.5 py-2.5 border border-slate-200/80 flex items-center gap-3">
                    <span class="text-slate-400 text-sm">📍</span>
                    <div class="w-full">
                        <label class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">País o Región</label>
                        <input type="text" value="Estados Unidos" class="w-full bg-transparent text-slate-800 font-semibold text-sm focus:outline-none" readonly>
                    </div>
                </div>

                <div class="md:col-span-3">
                    <button class="w-full py-3 px-4 btn-friendly-primary text-white font-semibold text-xs rounded-xl flex items-center justify-center gap-2">
                        <span>🔍 Escanear Ciudades</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- PANEL DE CIUDADES ENCONTRADAS -->
        <div class="soft-card rounded-2xl overflow-hidden">
            
            <!-- HEADER PANEL -->
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h2 class="text-base font-bold text-slate-900">Ciudades con más prospectos encontrados</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Selecciona las ciudades que deseas importar a tu lista de leads.</p>
                </div>
                <button class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">
                    Seleccionar todas (5)
                </button>
            </div>

            <!-- LISTA AMIGABLE -->
            <div class="p-4 space-y-2.5 bg-slate-50/50">

                <!-- Item 1 (Selected) -->
                <label class="soft-card-selected p-3.5 rounded-xl flex items-center justify-between cursor-pointer">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        <span class="text-sm font-bold text-slate-800">Miami, Fort Lauderdale</span>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-200/60 text-slate-600">Florida</span>
                    </div>
                    <span class="text-xs font-semibold text-amber-700 px-3 py-1 rounded-full bg-amber-50 border border-amber-200/60">
                        342 prospectos
                    </span>
                </label>

                <!-- Item 2 (Selected) -->
                <label class="soft-card-selected p-3.5 rounded-xl flex items-center justify-between cursor-pointer">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        <span class="text-sm font-bold text-slate-800">Houston, Dallas</span>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-200/60 text-slate-600">Texas</span>
                    </div>
                    <span class="text-xs font-semibold text-amber-700 px-3 py-1 rounded-full bg-amber-50 border border-amber-200/60">
                        288 prospectos
                    </span>
                </label>

                <!-- Item 3 (Selected) -->
                <label class="soft-card-selected p-3.5 rounded-xl flex items-center justify-between cursor-pointer">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                        <span class="text-sm font-bold text-slate-800">Los Ángeles, San Diego</span>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-200/60 text-slate-600">California</span>
                    </div>
                    <span class="text-xs font-semibold text-amber-700 px-3 py-1 rounded-full bg-amber-50 border border-amber-200/60">
                        315 prospectos
                    </span>
                </label>

                <!-- Item 4 (Unselected) -->
                <label class="soft-card p-3.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-slate-100/50 transition-colors">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-slate-400 focus:ring-slate-400 border-slate-300">
                        <span class="text-sm font-medium text-slate-700">Atlanta, Savannah</span>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">Georgia</span>
                    </div>
                    <span class="text-xs font-medium text-slate-600 px-3 py-1 rounded-full bg-slate-100 border border-slate-200">
                        112 prospectos
                    </span>
                </label>

                <!-- Item 5 (Unselected) -->
                <label class="soft-card p-3.5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-slate-100/50 transition-colors">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 rounded text-slate-400 focus:ring-slate-400 border-slate-300">
                        <span class="text-sm font-medium text-slate-700">Chicago, Aurora</span>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">Illinois</span>
                    </div>
                    <span class="text-xs font-medium text-slate-600 px-3 py-1 rounded-full bg-slate-100 border border-slate-200">
                        96 prospectos
                    </span>
                </label>

            </div>

            <!-- FOOTER AMIGABLE Y CON BOTONES LINDOS -->
            <div class="p-5 bg-white border-t border-slate-100 flex items-center justify-between">
                <div>
                    <span class="text-sm font-bold text-slate-900 block">Total: 945 prospectos seleccionados</span>
                    <span class="text-xs text-slate-400 font-medium">Se ignorarán duplicados automáticamente</span>
                </div>

                <button class="py-2.5 px-6 btn-friendly-accent text-white font-bold text-xs rounded-xl flex items-center gap-2">
                    <span>Importar 945 Leads a mi CRM</span>
                    <span>→</span>
                </button>
            </div>

        </div>

    </div>

</body>
</html>
