    let currentIdx = 0;

    function renderSlide() {
      const s = slides[currentIdx];
      const frame = document.getElementById('slideFrame');
      
      if (s.layout === 'cover') {
        frame.innerHTML = s.html;
      } else {
        frame.innerHTML = `
          <div class="slide-category">${s.cat}</div>
          <div class="slide-title">${s.title}</div>
          <div class="slide-subtitle">${s.subtitle || ''}</div>
          <div class="slide-divider"></div>
          <div class="slide-grid">
            ${s.content}
            <div class="image-preview-container">
              <img src="${s.img}" class="image-preview" alt="Pantalla Real CRM">
              <div class="image-caption">${s.imgCap || 'Pantalla Oficial ARIAS CRM'}</div>
            </div>
          </div>
        `;
      }

      document.getElementById('notesContent').textContent = s.notes;
      document.getElementById('slideCounter').textContent = `Slide ${s.num} / ${slides.length}`;
      
      document.querySelectorAll('.thumb-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === currentIdx);
      });
    }

    function changeSlide(direction) {
      currentIdx = Math.max(0, Math.min(slides.length - 1, currentIdx + direction));
      renderSlide();
    }

    function initThumbs() {
      const container = document.getElementById('thumbsNav');
      slides.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = `thumb-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = `${s.num}. ${s.title.substring(0, 18)}...`;
        btn.onclick = () => {
          currentIdx = idx;
          renderSlide();
        };
        container.appendChild(btn);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        changeSlide(-1);
      }
    });

    initThumbs();
    renderSlide();
  </script>
